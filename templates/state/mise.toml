[tools]
# Portable tools belong here. "latest" is the default policy; use an exact
# version only when reproducibility requires it.
rust = ["stable", "nightly"]
starship = "latest"
# "cargo:cargo-binstall" = "latest"
# node = "latest"
# python = "latest"
# "cargo:ripgrep" = "latest"
# "npm:pnpm" = "latest"
# "npm:@biomejs/biome" = "latest"
# "pipx:ruff" = "latest"

[tasks."reseed:restore"]
description = "Optional project-specific restore hook"
run = "echo 'No project-specific restore task configured'"

[tasks."reseed:shells"]
description = "Generate cross-platform shell integration after tools are installed"
run = "nu --no-config-file scripts/configure-shells.nu"

